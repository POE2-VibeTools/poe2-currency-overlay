<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reprice calibration</title>
<style>
  /* A transparent sheet over the whole screen. The game stays visible underneath, so the
     box is drawn around the real price field rather than around a guess at where it is. */
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair;
    background: rgba(0, 0, 0, 0.28); user-select: none; font: 13px system-ui, sans-serif; }
  #hint { position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    background: rgba(10, 12, 14, 0.92); color: #d8e1e8; border: 1px solid rgba(128, 157, 180, 0.45);
    padding: 10px 16px; white-space: nowrap; pointer-events: none; }
  #hint b { color: #fff; }
  #hint .esc { color: #8a949c; margin-left: 10px; }
  /* The drawn box punches a hole in the dim layer so the number is fully legible while
     it is being framed. */
  #box { position: fixed; display: none; border: 1px solid #9bd1ff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28); background: transparent; pointer-events: none; }
  #size { position: fixed; display: none; background: #0f1214; color: #9bd1ff;
    border: 1px solid rgba(128, 157, 180, 0.45); padding: 2px 6px; font-size: 11px;
    pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
  <div id="hint"><b id="hint-text">Drag a box around the price number</b><span class="esc" id="hint-esc">Esc to cancel</span></div>
  <div id="box"></div>
  <div id="size"></div>
<script src="reprice-calibrate-client.js"></script>
</body>
</html>
