<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reprice calibration</title>
<style>
  /* Calibration happens on a STILL of the screen, not over the live game - the same way
     the Net Worth calibration works, and for the same reason: you cannot magnify a
     transparent window. A frozen frame also means the price dialog cannot close under
     you halfway through drawing the box. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    cursor: crosshair; user-select: none; font: 13px system-ui, sans-serif; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); pointer-events: none; }
  #box { position: fixed; display: none; border: 1px solid #9bd1ff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); pointer-events: none; }
  #hint { position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
    background: rgba(10, 12, 14, 0.94); color: #d8e1e8;
    border: 1px solid rgba(128, 157, 180, 0.45); padding: 10px 16px;
    white-space: nowrap; pointer-events: none; z-index: 30; }
  #hint b { color: #fff; }
  #hint .esc { color: #8a949c; margin-left: 12px; }
  /* the loupe: odd magnification so one source pixel maps to an odd block and the
     crosshair can sit exactly on the middle of it */
  #loupe { position: fixed; width: 168px; height: 168px; border-radius: 50%;
    display: none; z-index: 20; overflow: hidden; pointer-events: none;
    border: 2px solid rgba(155, 209, 255, 0.9); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6); }
  #loupe canvas { display: block; }
  #coords { position: fixed; display: none; z-index: 25; pointer-events: none;
    background: #0f1214; color: #9bd1ff; border: 1px solid rgba(128, 157, 180, 0.45);
    padding: 2px 7px; font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="box"></div>
  <div id="loupe"><canvas width="168" height="168"></canvas></div>
  <div id="coords"></div>
  <div id="hint"><b>Drag a box around the price number</b><span class="esc">Esc to cancel</span></div>
<script src="reprice-calibrate-client.js"></script>
</body>
</html>
