<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--s-root); font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #bar {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--am-2) 30%, transparent);
  }
  button {
    appearance: none;
    background: color-mix(in srgb, var(--am-2) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--am-2) 30%, transparent);
    border-radius: 6px;
    color: var(--tx-gold2);
    font-size: 14px;
    width: 30px;
    height: 26px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--am-2) 22%, transparent); }
  button:disabled { opacity: 0.35; cursor: default; }
  #url {
    flex: 1;
    color: var(--tx-dim);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: ltr;
  }
</style>
<script>
  // separate document: themes.css keys off data-theme, and main passes the
  // active palette in the query string so this paints themed on first frame
  try { var t = new URLSearchParams(location.search).get('theme');
    document.documentElement.dataset.theme = t === 'industry' ? 'industry' : 'default'; } catch (e) {}
</script>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back">&#8592;</button>
    <button id="fwd" title="Forward">&#8594;</button>
    <button id="home" title="Back to the login page">&#8962;</button>
    <span id="url"></span>
  </div>
  <script src="login-shell-client.js"></script>
</body>
</html>
